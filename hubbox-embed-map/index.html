<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HubBox · Embed the map</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/hb-motion.js"></script>
    <link rel="stylesheet" href="assets/hubbox-theme.css" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Voice-over (paced, with a breath between phrases):
        0.83–2.60   "You embed the HubBox map,"
        4.78–6.53   "connect it to listen for events,"
        8.33–10.77  "like a shopper confirming their pickup point,"
       12.63–14.75  "then send that selection to your backend"
       16.47–18.82  "to save the order and update shipping rates."

      Scene cuts sit in the pauses (3.90 · 7.60 · 11.85 · 15.75), hidden under the
      transitions overlay. To retime: move a scene's data-start/data-duration here and
      the matching CUTS entry in compositions/transitions.html.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-embed"
        data-composition-id="s1-embed"
        data-composition-src="compositions/s1-embed.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-listen"
        data-composition-id="s2-listen"
        data-composition-src="compositions/s2-listen.html"
        data-start="3.9"
        data-duration="3.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-confirm"
        data-composition-id="s3-confirm"
        data-composition-src="compositions/s3-confirm.html"
        data-start="7.6"
        data-duration="4.25"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-send"
        data-composition-id="s4-send"
        data-composition-src="compositions/s4-send.html"
        data-start="11.85"
        data-duration="3.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-save"
        data-composition-id="s5-save"
        data-composition-src="compositions/s5-save.html"
        data-start="15.75"
        data-duration="6.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Pixel / blinds / iris transitions between scenes (transparent between cuts). -->
      <div
        id="el-transitions"
        data-composition-id="transitions"
        data-composition-src="compositions/transitions.html"
        data-start="0"
        data-duration="22.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 50"
      ></div>

      <!-- Placeholder VO (local Kokoro TTS). Replace the file with the real read, keep the id. -->
      <audio
        id="el-voiceover"
        src="assets/audio/voiceover.wav"
        data-start="0"
        data-duration="22.5"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
