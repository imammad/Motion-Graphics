<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s5-save-template">
      <link rel="stylesheet" href="assets/hubbox-theme.css" />
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Commit Mono";
          src: url("assets/fonts/commit-mono-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
          font-display: block;
        }
        #s5-root {
          position: absolute;
          inset: 0;
        }
        #s5-window {
          width: 900px;
          height: 660px;
        }
        #s5-body {
          padding: 28px 30px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        #s5-order {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-bottom: 18px;
          border-bottom: 1.5px solid var(--hb-blue-tint);
        }
        #s5-order-id {
          font-size: 30px;
          font-weight: 800;
          color: var(--hb-ink);
        }
        #s5-order-meta {
          font-size: 18px;
          font-weight: 500;
          color: var(--hb-muted);
          margin-top: 4px;
        }
        #s5-status {
          position: relative;
          width: 176px;
          height: 48px;
        }
        #s5-status .hb-pill {
          position: absolute;
          inset: 0;
          justify-content: center;
          font-size: 19px;
        }
        #s5-pending {
          background: #fff4e5;
          color: #b8650c;
        }
        #s5-saved {
          background: #e3f7ee;
          color: var(--hb-green);
        }
        #s5-point {
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 16px 18px;
          border-radius: 16px;
          background: var(--hb-surface);
        }
        .s5-pin-icon {
          width: 30px;
          height: 39px;
          color: var(--hb-blue);
          flex-shrink: 0;
        }
        .s5-label {
          font-size: 16px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--hb-muted);
        }
        .s5-value {
          font-size: 21px;
          font-weight: 700;
          color: var(--hb-ink);
          margin-top: 2px;
        }
        #s5-rates-title {
          margin-top: 4px;
        }
        .s5-rate {
          position: relative;
          height: 64px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 18px;
          border-radius: 14px;
          border: 2px solid var(--hb-blue-tint);
          font-size: 21px;
          font-weight: 700;
          color: var(--hb-ink);
        }
        .s5-rate-bg {
          position: absolute;
          inset: -2px;
          border-radius: 14px;
          border: 2px solid var(--hb-blue);
          background: var(--hb-blue-tint);
          transform-origin: 0% 50%;
        }
        .s5-rate > span {
          position: relative;
        }
        .s5-strike {
          position: absolute;
          left: 14px;
          right: 14px;
          top: 50%;
          height: 3px;
          margin-top: -1.5px;
          background: var(--hb-muted);
          transform-origin: 0% 50%;
        }
        #s5-updated {
          margin-left: 12px;
          padding: 4px 10px;
          border-radius: 8px;
          background: var(--hb-blue-dark);
          color: #ffffff;
          font-size: 15px;
          font-weight: 700;
          display: inline-block;
        }
        #s5-totals {
          margin-top: 6px;
          padding-top: 16px;
          border-top: 1.5px solid var(--hb-blue-tint);
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
        }
        .s5-total-col {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .s5-num {
          font-family: var(--hb-mono);
          font-weight: 500;
          font-size: 30px;
          color: var(--hb-ink);
        }
        #s5-total {
          font-size: 40px;
          color: var(--hb-blue-dark);
        }
      </style>

      <div id="s5-root" data-composition-id="s5-save" data-width="1920" data-height="1080">
        <div class="hb-scene">
          <div class="hb-bg"></div>
          <div class="hb-glow a"></div>
          <div class="hb-glow b"></div>

          <div id="s5-stage" class="hb-stage">
            <div class="hb-copy">
              <div id="s5-kicker" class="hb-kicker">
                <span class="hb-kicker-num">05</span>
                <span>Save &amp; update</span>
              </div>
              <h1 id="s5-headline" class="hb-headline">
                Save the order. Update <span class="hb-accent">shipping rates.</span>
              </h1>
              <p id="s5-sub" class="hb-sub">The pickup point is stored on the order and the rate updates at checkout.</p>
            </div>

            <div id="s5-window-host" class="px-host">
              <div id="s5-window" class="hb-window px-target">
                <div class="hb-window-bar">
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-window-title">Orders · your backend</span>
                </div>
                <div id="s5-body" class="hb-window-body">
                  <div id="s5-order" class="s5-block">
                    <div>
                      <div id="s5-order-id">Order #1042</div>
                      <div id="s5-order-meta">Jamie R. · 2 items</div>
                    </div>
                    <div id="s5-status">
                      <span id="s5-pending" class="hb-pill">● Pending</span>
                      <span id="s5-saved" class="hb-pill">✓ Saved</span>
                    </div>
                  </div>

                  <div id="s5-point" class="s5-block">
                    <div class="s5-pin-icon" id="s5-pin"></div>
                    <div>
                      <div class="s5-label">Pickup point</div>
                      <div class="s5-value">Corner Shop, High St · HB-0417</div>
                    </div>
                  </div>

                  <div id="s5-rates-title" class="s5-label s5-block">Shipping rate</div>
                  <div id="s5-rate-home" class="s5-rate s5-block">
                    <span data-layout-allow-occlusion>Home delivery</span><span data-layout-allow-occlusion>£4.99</span>
                    <div class="s5-strike" data-layout-allow-occlusion></div>
                  </div>
                  <div id="s5-rate-pickup" class="s5-rate s5-block">
                    <div class="s5-rate-bg"></div>
                    <span>HubBox pickup point<span id="s5-updated">Updated</span></span><span>£2.49</span>
                  </div>

                  <div id="s5-totals" class="s5-block">
                    <div class="s5-total-col">
                      <span class="s5-label">Shipping</span>
                      <span id="s5-ship" class="s5-num">£4.99</span>
                    </div>
                    <div class="s5-total-col" style="align-items: flex-end">
                      <span class="s5-label">Order total</span>
                      <span id="s5-total" class="s5-num">£64.99</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "s5-save";
          const DURATION = 6.75;
          const scope = document.querySelector("#s5-root");
          scope.querySelector("#s5-pin").innerHTML = HB.PIN_SVG;
          const tl = gsap.timeline({ paused: true });
          HB.drift(tl, scope, DURATION);

          // Copy — "to save the order and update shipping rates" (VO local 0.72–3.07)
          HB.rise(tl, "#s5-kicker", 0.4);
          HB.words(tl, "#s5-headline", 0.65, { stagger: 0.09 });
          HB.rise(tl, "#s5-sub", 1.7, { y: 18 });

          // Backend order view builds from pixels
          HB.pixelReveal(tl, "#s5-window-host", 0.3, { cols: 15, rows: 11, from: "diag", seed: 51 });
          HB.rise(tl, "#s5-body .s5-block", 0.95, { y: 16, stagger: 0.08 });

          // "save the order" — status pixel-swaps Pending → Saved
          HB.pixelSwap(tl, "#s5-status", "#s5-pending", "#s5-saved", 1.3, { seed: 52 });

          // "update shipping rates" — home rate struck, pickup rate selected, totals tick down
          tl.fromTo(".s5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: HB.EASE.move }, 2.1);
          tl.fromTo("#s5-rate-home > span", { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "power2.out" }, 2.2);
          tl.fromTo("#s5-rate-pickup .s5-rate-bg", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: HB.EASE.move }, 2.2);
          HB.pop(tl, "#s5-updated", 2.55, { duration: 0.6, from: 0.5 });

          const money = { ship: 4.99, total: 64.99 };
          const ship = scope.querySelector("#s5-ship");
          const total = scope.querySelector("#s5-total");
          tl.fromTo(
            money,
            { ship: 4.99, total: 64.99 },
            {
              ship: 2.49,
              total: 62.49,
              duration: 0.9,
              ease: "power2.inOut",
              onUpdate: () => {
                ship.textContent = "£" + money.ship.toFixed(2);
                total.textContent = "£" + money.total.toFixed(2);
              },
            },
            2.35,
          );

          // Final scene: let it breathe, then a soft settle to white.
          tl.fromTo("#s5-stage", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, DURATION - 0.75);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
