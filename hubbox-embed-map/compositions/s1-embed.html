<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s1-embed-template">
      <link rel="stylesheet" href="assets/hubbox-theme.css" />
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        #s1-root {
          position: absolute;
          inset: 0;
        }
        #s1-window {
          width: 900px;
          height: 660px;
        }
        #s1-body {
          padding: 28px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        #s1-options {
          display: flex;
          gap: 16px;
        }
        .s1-option {
          flex: 1;
          height: 92px;
          border-radius: 18px;
          border: 2px solid var(--hb-blue-tint);
          background: var(--hb-surface);
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 0 22px;
        }
        .s1-option.is-on {
          border-color: var(--hb-blue);
          background: var(--hb-white);
          box-shadow: 0 12px 30px rgba(61, 138, 252, 0.16);
        }
        .s1-radio {
          width: 26px;
          height: 26px;
          border-radius: 50%;
          border: 2.5px solid var(--hb-blue-light);
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .is-on .s1-radio {
          border-color: var(--hb-blue);
        }
        .is-on .s1-radio::after {
          content: "";
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--hb-blue);
        }
        .s1-option-label {
          font-size: 22px;
          font-weight: 700;
          color: var(--hb-ink);
        }
        .s1-option-meta {
          font-size: 18px;
          font-weight: 500;
          color: var(--hb-muted);
          margin-top: 4px;
        }
        #s1-map-host {
          height: 428px;
        }
        #s1-map {
          position: absolute;
          inset: 0;
          border-radius: 20px;
          overflow: hidden;
          border: 1.5px solid var(--hb-blue-tint);
        }
        .s1-pin {
          position: absolute;
          width: 40px;
          height: 52px;
          color: var(--hb-blue);
          transform-origin: 50% 100%;
          filter: drop-shadow(0 8px 10px rgba(31, 95, 214, 0.25));
        }
        #s1-tag {
          position: absolute;
          right: 36px;
          top: -28px;
          z-index: 8;
          padding: 14px 20px;
          border-radius: 14px;
          background: var(--hb-ink);
          color: #ffffff;
          font-family: var(--hb-mono);
          font-size: 21px;
          box-shadow: 0 18px 40px rgba(14, 27, 51, 0.28);
        }
        #s1-tag .t {
          color: var(--hb-blue-light);
        }
        #s1-tag .a {
          color: #ffd28a;
        }
      </style>

      <div id="s1-root" data-composition-id="s1-embed" data-width="1920" data-height="1080">
        <div class="hb-scene">
          <div class="hb-bg"></div>
          <div class="hb-glow a"></div>
          <div class="hb-glow b"></div>

          <div class="hb-stage">
            <div class="hb-copy">
              <div id="s1-kicker" class="hb-kicker">
                <span class="hb-kicker-num">01</span>
                <span>Embed</span>
              </div>
              <h1 id="s1-headline" class="hb-headline">
                Embed the <span class="hb-accent">HubBox map</span>
              </h1>
              <p id="s1-sub" class="hb-sub">One snippet puts pickup points right inside your checkout.</p>
            </div>

            <div id="s1-window-host" class="px-host">
              <div id="s1-window" class="hb-window px-target">
                <div class="hb-window-bar">
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-window-title">yourstore.com/checkout</span>
                </div>
                <div id="s1-body" class="hb-window-body">
                  <div id="s1-options">
                    <div class="s1-option">
                      <span class="s1-radio"></span>
                      <div>
                        <div class="s1-option-label">Home delivery</div>
                        <div class="s1-option-meta">2–3 days · £4.99</div>
                      </div>
                    </div>
                    <div class="s1-option is-on">
                      <span class="s1-radio"></span>
                      <div>
                        <div class="s1-option-label">Collect nearby</div>
                        <div class="s1-option-meta">Pickup point · £2.49</div>
                      </div>
                    </div>
                  </div>

                  <div id="s1-map-host" class="px-host">
                    <div id="s1-map" class="px-target">
                      <div id="s1-map-art" style="position: absolute; inset: 0"></div>
                      <div class="s1-pin" style="left: 150px; top: 120px"></div>
                      <div class="s1-pin" style="left: 380px; top: 210px"></div>
                      <div class="s1-pin" style="left: 560px; top: 90px"></div>
                      <div class="s1-pin" style="left: 690px; top: 260px"></div>
                      <div class="s1-pin" style="left: 260px; top: 300px"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="s1-tag">
                &lt;<span class="t">hubbox-map</span> <span class="a">store</span>="yourstore" /&gt;
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "s1-embed";
          const DURATION = 3.9;
          const scope = document.querySelector("#s1-root");
          scope.querySelector("#s1-map-art").innerHTML = HB.mapSVG();
          scope.querySelectorAll(".s1-pin").forEach((p) => (p.innerHTML = HB.PIN_SVG));

          const tl = gsap.timeline({ paused: true });
          HB.drift(tl, scope, DURATION);

          // Copy — lands with "You embed the HubBox map" (VO 0.83–2.60)
          HB.rise(tl, "#s1-kicker", 0.4);
          HB.words(tl, "#s1-headline", 0.65);
          HB.rise(tl, "#s1-sub", 1.35, { y: 18 });

          // Checkout window builds from pixels, then the map pixels in on "map"
          HB.pixelReveal(tl, "#s1-window-host", 0.45, { cols: 15, rows: 11, from: "diag", seed: 11 });
          HB.rise(tl, "#s1-options .s1-option", 1.15, { y: 16, stagger: 0.12 });
          HB.wipe(tl, "#s1-tag", 1.3, { duration: 0.8 });
          HB.pixelReveal(tl, "#s1-map-host", 1.6, {
            cols: 13,
            rows: 7,
            from: "radial",
            seed: 12,
            radius: 20,
            spread: 0.4,
            cell: 0.28,
          });
          HB.pop(tl, "#s1-root .s1-pin", 2.45, { stagger: 0.09, duration: 0.7 });

          // Slow push-in keeps the hold alive while the viewer reads.
          tl.fromTo("#s1-window-host", { scale: 0.97 }, { scale: 1, duration: DURATION, ease: "sine.out" }, 0);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
