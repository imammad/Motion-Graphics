<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s4-send-template">
      <link rel="stylesheet" href="assets/hubbox-theme.css" />
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Commit Mono";
          src: url("assets/fonts/commit-mono-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
          font-display: block;
        }
        #s4-root {
          position: absolute;
          inset: 0;
        }
        #s4-diagram {
          position: relative;
          width: 920px;
          height: 660px;
          flex-shrink: 0;
        }
        .s4-node-host {
          position: absolute;
          top: 410px;
          width: 250px;
          height: 230px;
        }
        #s4-node-l-host {
          left: 0;
        }
        #s4-node-r-host {
          right: 0;
        }
        .s4-node {
          position: absolute;
          inset: 0;
          border-radius: 26px;
          background: var(--hb-white);
          border: 1.5px solid var(--hb-blue-tint);
          box-shadow: var(--hb-card-shadow);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
        }
        .s4-icon {
          width: 84px;
          height: 84px;
          border-radius: 22px;
          background: var(--hb-blue-tint);
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--hb-blue);
        }
        .s4-label {
          font-size: 24px;
          font-weight: 800;
          color: var(--hb-ink);
        }
        .s4-caption {
          font-size: 17px;
          font-weight: 600;
          color: var(--hb-muted);
          margin-top: -10px;
        }
        #s4-node-r-ring {
          position: absolute;
          inset: 0;
          border-radius: 26px;
          border: 3px solid var(--hb-blue);
        }
        #s4-wire {
          position: absolute;
          left: 250px;
          top: 521px;
          width: 420px;
          height: 8px;
          border-radius: 4px;
          background: repeating-linear-gradient(
            90deg,
            var(--hb-blue-light) 0 18px,
            transparent 18px 30px
          );
        }
        #s4-packet {
          position: absolute;
          left: 226px;
          top: 497px;
          width: 56px;
          height: 56px;
          border-radius: 16px;
          background: var(--hb-gradient);
          box-shadow: 0 14px 30px rgba(61, 138, 252, 0.45);
          color: #ffffff;
          font-family: var(--hb-mono);
          font-size: 22px;
          font-weight: 500;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 4;
        }
        #s4-ok {
          position: absolute;
          right: 70px;
          top: 372px;
          z-index: 5;
          padding: 10px 16px;
          border-radius: 12px;
          background: var(--hb-green);
          color: #ffffff;
          font-family: var(--hb-mono);
          font-size: 19px;
          font-weight: 500;
          box-shadow: 0 12px 26px rgba(31, 174, 116, 0.35);
        }
        #s4-json-host {
          position: absolute;
          left: 110px;
          top: 0;
          width: 700px;
          height: 330px;
        }
        #s4-json {
          position: absolute;
          inset: 0;
          border-radius: 24px;
          background: var(--hb-white);
          border: 1.5px solid var(--hb-blue-tint);
          box-shadow: var(--hb-card-shadow);
          padding: 26px 30px;
          font-family: var(--hb-mono);
          font-weight: 500;
          font-size: 22px;
          line-height: 40px;
          color: var(--hb-ink);
        }
        #s4-json .req {
          display: flex;
          gap: 14px;
          align-items: center;
          margin-bottom: 10px;
        }
        #s4-json .verb {
          padding: 2px 12px;
          border-radius: 8px;
          background: var(--hb-blue-dark);
          color: #ffffff;
          font-size: 19px;
        }
        #s4-json .path {
          color: var(--hb-muted);
        }
        #s4-json .key {
          color: var(--hb-blue-dark);
        }
        #s4-json .str {
          color: #c46a12;
        }
        .s4-json-line {
          display: block;
          white-space: pre;
        }
      </style>

      <div id="s4-root" data-composition-id="s4-send" data-width="1920" data-height="1080">
        <div class="hb-scene">
          <div class="hb-bg"></div>
          <div class="hb-glow a"></div>
          <div class="hb-glow b"></div>

          <div class="hb-stage">
            <div class="hb-copy">
              <div id="s4-kicker" class="hb-kicker">
                <span class="hb-kicker-num">04</span>
                <span>Send</span>
              </div>
              <h1 id="s4-headline" class="hb-headline">
                Send it to your <span class="hb-accent">backend</span>
              </h1>
              <p id="s4-sub" class="hb-sub">Post the selected point with the order, server to server.</p>
            </div>

            <div id="s4-diagram">
              <div id="s4-json-host" class="px-host">
                <div id="s4-json" class="px-target">
                  <div class="req"><span class="verb">POST</span><span class="path">/api/orders/1042/pickup</span></div>
                  <span class="s4-json-line">{</span>
                  <span class="s4-json-line">  <span class="key">"pickupPointId"</span>: <span class="str">"HB-0417"</span>,</span>
                  <span class="s4-json-line">  <span class="key">"name"</span>: <span class="str">"Corner Shop, High St"</span>,</span>
                  <span class="s4-json-line">  <span class="key">"service"</span>: <span class="str">"hubbox_pickup"</span></span>
                  <span class="s4-json-line">}</span>
                </div>
              </div>

              <div id="s4-wire"></div>

              <div id="s4-node-l-host" class="s4-node-host px-host">
                <div class="s4-node px-target">
                  <div class="s4-icon">
                    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
                  </div>
                  <div class="s4-label">Checkout</div>
                  <div class="s4-caption">pickup:confirmed</div>
                </div>
              </div>

              <div id="s4-node-r-host" class="s4-node-host px-host">
                <div class="s4-node px-target">
                  <div class="s4-icon">
                    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>
                  </div>
                  <div class="s4-label">Your backend</div>
                  <div class="s4-caption">/api/orders</div>
                  <div id="s4-node-r-ring"></div>
                </div>
              </div>

              <div id="s4-packet">{ }</div>
              <div id="s4-ok">200 OK</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "s4-send";
          const DURATION = 3.9;
          const scope = document.querySelector("#s4-root");
          const tl = gsap.timeline({ paused: true });
          HB.drift(tl, scope, DURATION);

          // Copy — "then send that selection to your backend" (VO local 0.78–2.90)
          HB.rise(tl, "#s4-kicker", 0.4);
          HB.words(tl, "#s4-headline", 0.7);
          HB.rise(tl, "#s4-sub", 1.35, { y: 18 });

          // The two ends of the request build from pixels
          HB.pixelReveal(tl, "#s4-node-l-host", 0.3, { cols: 6, rows: 6, seed: 41, radius: 26, spread: 0.35 });
          HB.pixelReveal(tl, "#s4-node-r-host", 0.5, { cols: 6, rows: 6, seed: 42, radius: 26, spread: 0.35 });

          // "selection" — the payload pixels in, the wire draws on "send"
          HB.pixelReveal(tl, "#s4-json-host", 0.8, { cols: 16, rows: 8, from: "left", seed: 43, radius: 24, spread: 0.45 });
          HB.wipe(tl, "#s4-json .s4-json-line", 1.55, { duration: 0.5, stagger: 0.08 });
          HB.wipe(tl, "#s4-wire", 1.0, { duration: 0.8 });

          // Packet travels to the backend, landing on "backend"
          tl.fromTo("#s4-packet", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: HB.EASE.enter }, 1.55);
          tl.fromTo("#s4-packet", { x: 0 }, { x: 420, duration: 0.95, ease: HB.EASE.move }, 1.75);
          tl.to("#s4-packet", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 2.62);

          // Backend acknowledges
          tl.fromTo("#s4-node-r-ring", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 2.65);
          tl.fromTo("#s4-node-r-host", { scale: 1 }, { scale: 1.04, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 2.65);
          HB.pop(tl, "#s4-ok", 2.75, { duration: 0.7, from: 0.6 });

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
