<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s3-confirm-template">
      <link rel="stylesheet" href="assets/hubbox-theme.css" />
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Commit Mono";
          src: url("assets/fonts/commit-mono-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
          font-display: block;
        }
        #s3-root {
          position: absolute;
          inset: 0;
        }
        #s3-window {
          width: 900px;
          height: 660px;
        }
        #s3-map {
          position: absolute;
          inset: 0;
        }
        #s3-panel {
          position: absolute;
          left: 22px;
          top: 22px;
          width: 340px;
          padding: 18px;
          border-radius: 20px;
          background: var(--hb-white);
          box-shadow: 0 18px 40px rgba(14, 27, 51, 0.12);
          display: flex;
          flex-direction: column;
          gap: 10px;
          z-index: 3;
        }
        #s3-panel-title {
          height: 28px;
          margin-bottom: 2px;
          font-size: 19px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--hb-muted);
        }
        .s3-row {
          position: relative;
          height: 76px;
          border-radius: 14px;
          border: 2px solid transparent;
          background: var(--hb-surface);
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 14px;
        }
        .s3-row-sel {
          position: absolute;
          inset: -2px;
          border-radius: 14px;
          border: 2px solid var(--hb-blue);
          background: var(--hb-blue-tint);
        }
        .s3-badge {
          position: relative;
          width: 40px;
          height: 40px;
          border-radius: 12px;
          background: var(--hb-white);
          color: var(--hb-blue-dark);
          font-size: 19px;
          font-weight: 800;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .s3-row-text {
          position: relative;
          flex: 1;
        }
        .s3-row-name {
          font-size: 20px;
          font-weight: 700;
          color: var(--hb-ink);
        }
        .s3-row-meta {
          font-size: 16px;
          font-weight: 500;
          color: var(--hb-muted);
          margin-top: 3px;
        }
        .s3-pin {
          position: absolute;
          width: 40px;
          height: 52px;
          color: var(--hb-blue-light);
          transform-origin: 50% 100%;
          filter: drop-shadow(0 8px 10px rgba(31, 95, 214, 0.22));
        }
        #s3-pin-a {
          color: var(--hb-blue);
        }
        #s3-card {
          position: absolute;
          right: 22px;
          bottom: 22px;
          width: 380px;
          height: 210px;
          border-radius: 20px;
          background: var(--hb-white);
          box-shadow: 0 22px 50px rgba(14, 27, 51, 0.16);
          padding: 22px;
          display: flex;
          flex-direction: column;
          gap: 6px;
          z-index: 3;
        }
        #s3-card-name {
          font-size: 24px;
          font-weight: 800;
          color: var(--hb-ink);
        }
        #s3-card-meta {
          font-size: 18px;
          font-weight: 500;
          color: var(--hb-muted);
        }
        #s3-button {
          position: absolute;
          left: 22px;
          right: 22px;
          bottom: 22px;
          height: 64px;
          border-radius: 16px;
          overflow: hidden;
        }
        #s3-button > div {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 22px;
          font-weight: 700;
          color: #ffffff;
        }
        #s3-btn-idle {
          background: var(--hb-ink);
        }
        #s3-btn-done {
          background: var(--hb-gradient);
        }
        #s3-toast {
          position: absolute;
          right: 22px;
          bottom: 252px;
          z-index: 4;
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 12px 18px;
          border-radius: 14px;
          background: var(--hb-blue-dark);
          color: #ffffff;
          font-family: var(--hb-mono);
          font-size: 20px;
          font-weight: 500;
          box-shadow: 0 14px 30px rgba(61, 138, 252, 0.4);
        }
        #s3-cursor {
          z-index: 30;
        }
      </style>

      <div id="s3-root" data-composition-id="s3-confirm" data-width="1920" data-height="1080">
        <div class="hb-scene">
          <div class="hb-bg"></div>
          <div class="hb-glow a"></div>
          <div class="hb-glow b"></div>

          <div class="hb-stage">
            <div class="hb-copy">
              <div id="s3-kicker" class="hb-kicker">
                <span class="hb-kicker-num">03</span>
                <span>Shopper picks</span>
              </div>
              <h1 id="s3-headline" class="hb-headline">
                They confirm a <span class="hb-accent">pickup point</span>
              </h1>
              <p id="s3-sub" class="hb-sub">One tap on the map fires the event you’re listening for.</p>
            </div>

            <div id="s3-window-host" class="px-host">
              <div id="s3-window" class="hb-window px-target">
                <div class="hb-window-bar">
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-window-title">Choose a pickup point</span>
                </div>
                <div class="hb-window-body">
                  <div id="s3-map"></div>
                  <div class="s3-pin" id="s3-pin-a" style="left: 560px; top: 120px"></div>
                  <div class="s3-pin" style="left: 440px; top: 300px"></div>
                  <div class="s3-pin" style="left: 760px; top: 70px"></div>
                  <div class="s3-pin" style="left: 410px; top: 40px"></div>

                  <div id="s3-panel">
                    <div id="s3-panel-title">Near you</div>
                    <div class="s3-row" id="s3-row-a">
                      <div class="s3-row-sel"></div>
                      <span class="s3-badge">A</span>
                      <div class="s3-row-text">
                        <div class="s3-row-name">Corner Shop, High St</div>
                        <div class="s3-row-meta">0.3 mi · Open till 10pm</div>
                      </div>
                    </div>
                    <div class="s3-row">
                      <span class="s3-badge">B</span>
                      <div class="s3-row-text">
                        <div class="s3-row-name">Parcel Locker 24/7</div>
                        <div class="s3-row-meta">0.5 mi · Always open</div>
                      </div>
                    </div>
                    <div class="s3-row">
                      <span class="s3-badge">C</span>
                      <div class="s3-row-text">
                        <div class="s3-row-name">Station Kiosk</div>
                        <div class="s3-row-meta">0.8 mi · Open till 8pm</div>
                      </div>
                    </div>
                  </div>

                  <div id="s3-card">
                    <div id="s3-card-name">Corner Shop, High St</div>
                    <div id="s3-card-meta">Pickup from tomorrow · £2.49</div>
                    <div id="s3-button">
                      <div id="s3-btn-idle">Confirm pickup point</div>
                      <div id="s3-btn-done">Confirmed ✓</div>
                    </div>
                  </div>

                  <div id="s3-toast"><span>⚡</span><span>pickup:confirmed</span></div>
                </div>
              </div>
              <div id="s3-cursor" class="hb-cursor"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "s3-confirm";
          const DURATION = 4.25;
          const scope = document.querySelector("#s3-root");
          scope.querySelector("#s3-map").innerHTML = HB.mapSVG();
          scope.querySelectorAll(".s3-pin").forEach((p) => (p.innerHTML = HB.PIN_SVG));
          scope.querySelector("#s3-cursor").innerHTML = HB.CURSOR_SVG;

          const tl = gsap.timeline({ paused: true });
          HB.drift(tl, scope, DURATION);

          // Copy — "like a shopper confirming their pickup point" (VO local 0.73–3.17)
          HB.rise(tl, "#s3-kicker", 0.4);
          HB.words(tl, "#s3-headline", 0.7);
          HB.rise(tl, "#s3-sub", 1.45, { y: 18 });

          // Map window pixels out from the centre
          HB.pixelReveal(tl, "#s3-window-host", 0.3, { cols: 15, rows: 11, from: "radial", seed: 31 });
          HB.rise(tl, "#s3-panel .s3-row", 1.05, { y: 16, stagger: 0.1 });
          HB.pop(tl, "#s3-root .s3-pin", 1.1, { stagger: 0.08, duration: 0.7 });

          // Shopper: cursor glides in and picks point A ("shopper confirming")
          tl.set("#s3-cursor", { x: 980, y: 720 }, 0);
          tl.fromTo("#s3-cursor", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.3);
          HB.cursorTo(tl, "#s3-cursor", 1.3, 236, 176, { duration: 0.75, click: true });
          tl.fromTo(
            "#s3-row-a .s3-row-sel",
            { opacity: 0, scale: 0.96 },
            { opacity: 1, scale: 1, duration: 0.45, ease: HB.EASE.enter },
            2.08,
          );
          tl.fromTo(
            "#s3-pin-a",
            { scale: 1, y: 0 },
            { scale: 1.45, y: -6, duration: 0.6, ease: "back.out(1.6)", immediateRender: false },
            2.1,
          );

          // Detail card wipes up, cursor presses Confirm ("pickup point")
          HB.wipe(tl, "#s3-card", 2.15, { from: "bottom", duration: 0.6 });
          HB.cursorTo(tl, "#s3-cursor", 2.25, 680, 586, { duration: 0.6, click: true });
          tl.fromTo("#s3-btn-done", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.9);
          tl.fromTo("#s3-button", { scale: 1 }, { scale: 0.96, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 2.85);

          // The event fires
          HB.rise(tl, "#s3-toast", 3.0, { y: 24, duration: 0.7 });

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
