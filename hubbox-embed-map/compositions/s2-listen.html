<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s2-listen-template">
      <link rel="stylesheet" href="assets/hubbox-theme.css" />
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Commit Mono";
          src: url("assets/fonts/commit-mono-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
          font-display: block;
        }
        #s2-root {
          position: absolute;
          inset: 0;
        }
        #s2-window {
          width: 900px;
          height: 600px;
        }
        #s2-code {
          position: relative;
          padding: 34px 34px 0 0;
          font-family: var(--hb-mono);
          font-weight: 500;
          font-size: 25px;
          line-height: 54px;
          color: var(--hb-ink);
        }
        .s2-line {
          position: relative;
          display: flex;
          white-space: pre;
        }
        .s2-ln {
          width: 76px;
          flex-shrink: 0;
          text-align: right;
          padding-right: 26px;
          color: var(--hb-muted);
        }
        .s2-text {
          display: block;
          position: relative;
          z-index: 1;
        }
        .k {
          color: var(--hb-blue-dark);
          font-weight: 500;
        }
        .s {
          color: #c46a12;
        }
        .f {
          color: var(--hb-blue);
        }
        .m {
          color: var(--hb-muted);
        }
        #s2-highlight {
          position: absolute;
          left: 60px;
          right: 24px;
          top: 142px;
          height: 54px;
          border-radius: 12px;
          background: var(--hb-blue-tint);
          border-left: 4px solid var(--hb-blue);
          transform-origin: 0% 50%;
        }
        #s2-status {
          position: absolute;
          left: 28px;
          right: 28px;
          bottom: 28px;
          height: 150px;
          border-radius: 20px;
          background: var(--hb-surface);
          border: 1.5px solid var(--hb-blue-tint);
          padding: 22px 26px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        #s2-listening {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 22px;
          font-weight: 700;
          color: var(--hb-ink);
        }
        #s2-beacon {
          position: relative;
          width: 22px;
          height: 22px;
        }
        #s2-beacon .core,
        #s2-beacon .ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
        }
        #s2-beacon .core {
          background: var(--hb-blue);
        }
        #s2-beacon .ring {
          border: 2.5px solid var(--hb-blue);
        }
        #s2-events {
          display: flex;
          gap: 14px;
        }
        .s2-event {
          font-family: var(--hb-mono);
          font-size: 19px;
          font-weight: 500;
          padding: 10px 16px;
          border-radius: 12px;
          background: var(--hb-white);
          border: 1.5px solid var(--hb-blue-tint);
          color: var(--hb-muted);
        }
        .s2-event.is-key {
          background: var(--hb-blue-dark);
          border-color: var(--hb-blue-dark);
          color: #ffffff;
          box-shadow: 0 12px 26px rgba(61, 138, 252, 0.35);
        }
      </style>

      <div id="s2-root" data-composition-id="s2-listen" data-width="1920" data-height="1080">
        <div class="hb-scene">
          <div class="hb-bg"></div>
          <div class="hb-glow a"></div>
          <div class="hb-glow b"></div>

          <div class="hb-stage">
            <div class="hb-copy">
              <div id="s2-kicker" class="hb-kicker">
                <span class="hb-kicker-num">02</span>
                <span>Connect</span>
              </div>
              <h1 id="s2-headline" class="hb-headline">
                Listen for <span class="hb-accent">events</span>
              </h1>
              <p id="s2-sub" class="hb-sub">Subscribe once. The map tells you what the shopper does.</p>
            </div>

            <div id="s2-window-host" class="px-host">
              <div id="s2-window" class="hb-window px-target">
                <div class="hb-window-bar">
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-dot"></span>
                  <span class="hb-window-title">checkout.js</span>
                </div>
                <div class="hb-window-body">
                  <div id="s2-code">
                    <div id="s2-highlight"></div>
                    <div class="s2-line">
                      <span class="s2-ln">1</span><span class="s2-text"><span class="k">const</span> map = HubBox.<span class="f">embed</span>(<span class="s">"#hubbox-map"</span>);</span>
                    </div>
                    <div class="s2-line">
                      <span class="s2-ln">2</span><span class="s2-text"> </span>
                    </div>
                    <div class="s2-line">
                      <span class="s2-ln">3</span><span class="s2-text">map.<span class="f">on</span>(<span class="s">"pickup:confirmed"</span>, (point) <span class="k">=&gt;</span> {</span>
                    </div>
                    <div class="s2-line">
                      <span class="s2-ln">4</span><span class="s2-text">  <span class="f">saveSelection</span>(point);</span>
                    </div>
                    <div class="s2-line">
                      <span class="s2-ln">5</span><span class="s2-text">});</span>
                    </div>
                  </div>

                  <div id="s2-status">
                    <div id="s2-listening">
                      <div id="s2-beacon">
                        <span class="ring r1"></span>
                        <span class="ring r2"></span>
                        <span class="core"></span>
                      </div>
                      <span>Listening for map events…</span>
                    </div>
                    <div id="s2-events">
                      <span class="s2-event">map:ready</span>
                      <span class="s2-event">pickup:selected</span>
                      <span class="s2-event is-key">pickup:confirmed</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "s2-listen";
          const DURATION = 3.7;
          const scope = document.querySelector("#s2-root");
          const tl = gsap.timeline({ paused: true });
          HB.drift(tl, scope, DURATION);

          // Copy — "connect it to listen for events" (VO local 0.88–2.63)
          HB.rise(tl, "#s2-kicker", 0.45);
          HB.words(tl, "#s2-headline", 0.75);
          HB.rise(tl, "#s2-sub", 1.3, { y: 18 });

          // Editor pixels in from the left, code types in line by line on "connect"
          HB.pixelReveal(tl, "#s2-window-host", 0.3, { cols: 15, rows: 10, from: "left", seed: 21 });
          HB.wipe(tl, "#s2-code .s2-text", 1.0, { duration: 0.6, stagger: 0.16 });

          // "listen" — the .on() line lights up
          tl.fromTo(
            "#s2-highlight",
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.7, ease: HB.EASE.move },
            1.6,
          );

          // Listening beacon + "events" stream in
          HB.rise(tl, "#s2-status", 1.55, { y: 20 });
          tl.fromTo(
            "#s2-beacon .ring",
            { scale: 1, opacity: 0.7 },
            { scale: 2.6, opacity: 0, duration: 1.1, ease: "sine.out", stagger: 0.55, repeat: 1 },
            1.8,
          );
          HB.pop(tl, "#s2-events .s2-event", 2.1, { stagger: 0.18, duration: 0.7, from: 0.6 });

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
